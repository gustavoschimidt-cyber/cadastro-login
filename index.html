<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica Bem-Estar - Portal do Paciente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Clínica Bem-Estar</h1>
    <p class="subtitulo">Portal do Paciente</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Cadastro</h2>
      <form id="formCadastro" novalidate>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome">

        <label for="email">E-mail</label>
        <input type="email" id="email">

        <label for="senha">Senha</label>
        <input type="password" id="senha">
        <small>Mínimo de 6 caracteres e pelo menos 1 número</small>

        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar">

        <button type="submit">Cadastrar</button>
        <p id="msgCadastro" class="mensagem"></p>
      </form>
    </section>

    <section class="card">
      <h2>Login</h2>
      <form id="formLogin" novalidate>
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail">

        <label for="loginSenha">Senha</label>
        <input type="password" id="loginSenha">

        <button type="submit">Entrar</button>
        <p id="msgLogin" class="mensagem"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
